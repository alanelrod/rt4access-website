<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RT4Access — Market mapping</title>
  <meta name="description" content="Market mapping of companies and regional markets.">
  <meta name="theme-color" content="#100818">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="#top">
        <img class="logo-mark" src="assets/brand/rt4access.png" alt="">
        <span>
          <strong>RT4Access</strong>
          <small>Access engine</small>
        </span>
      </a>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap">
        <p class="eyebrow"><span class="diamond" aria-hidden="true"></span> RT Engine · Market maps</p>
        <h1>Market mapping of companies and regional markets.</h1>
        <p class="lede">A company, then the regions it sits in. Palantir is the first map.</p>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <p class="kicker">A company</p>
        <h2>Palantir.</h2>
        <figure class="shot">
          <img src="assets/product/company.png" alt="Palantir as a company map, with Americas, Europe, the Middle East, and Asia-Pacific">
          <figcaption>The company</figcaption>
        </figure>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <p class="kicker">Regional markets</p>
        <h2>Americas and Europe.</h2>
        <div class="pair">
          <figure class="shot">
            <img src="assets/product/americas.png" alt="The Americas regional market for Palantir">
            <figcaption>Americas</figcaption>
          </figure>
          <figure class="shot">
            <img src="assets/product/europe.png" alt="The Europe regional market for Palantir">
            <figcaption>Europe</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Market mapping of companies and regional markets.</p>
    </div>
  </footer>
</body>
</html>
