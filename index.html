<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RT4Access — Your next opportunity is 4 people away</title>
  <meta name="description" content="North Carolina’s richest 500 is the first market map. Pictures of the product.">
  <meta name="theme-color" content="#100818">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="#top">
        <img class="logo-mark" src="assets/brand/rt4access.png" alt="">
        <span>
          <strong>RT4Access</strong>
          <small>Access engine</small>
        </span>
      </a>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap hero-grid">
        <div>
          <p class="eyebrow"><span class="diamond" aria-hidden="true"></span> RT Engine · Market maps</p>
          <h1>Your next<br>opportunity<br><em>is 4 people<br>away.</em></h1>
          <p class="lede">Map them. North Carolina’s richest 500 is the first market map. The frames below are the product.</p>
        </div>
        <figure class="shot">
          <img src="assets/product/palantir-geo.png" alt="Palantir company map, geo view, in RT4Access">
          <figcaption>Palantir · geo</figcaption>
        </figure>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <p class="kicker">Market 01</p>
        <h2>The NC 500.</h2>
        <figure class="shot">
          <img src="assets/product/nc500.png" alt="The richest people in North Carolina, in RT4Access">
          <figcaption>NC 500</figcaption>
        </figure>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <p class="kicker">Same map</p>
        <h2>Hierarchy.</h2>
        <figure class="shot">
          <img src="assets/product/hierarchy.png" alt="Palantir hierarchy in RT4Access">
          <figcaption>Palantir · hierarchy</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Pictures of RT4Access. Not a second copy of the product.</p>
    </div>
  </footer>
</body>
</html>
